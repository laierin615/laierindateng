<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dateng 簡報練習</title>
<meta name="description" content="Dateng 野菜探險家｜2026 原住民族教育論壇 簡報與逐字稿練習">
<meta name="theme-color" content="#16161e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dateng 練習">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --paper:#F8F4EC; --sand:#EDE5D0; --ink:#16161e; --ink-2:#1e1e2e;
  --rust:#C1440E; --sage:#5d8a5d; --neon:#DFFF00; --amber:#d48a06;
  --text:#1f1d18; --text-2:#5d584d; --rule:rgba(31,29,24,.14); --card:#fffdf8; --bg:var(--paper);
  --stage:#6b6455; --stage-bg:rgba(193,68,14,.08); --shadow:0 6px 18px rgba(20,18,12,.12);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --fs:18px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121218; --card:#1c1c26; --text:#f1ede3; --text-2:#a8a499; --rule:rgba(243,239,228,.14);
    --stage:#c9b99a; --stage-bg:rgba(223,255,0,.07); --sand:#262633; --shadow:0 6px 18px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#121218; --card:#1c1c26; --text:#f1ede3; --text-2:#a8a499; --rule:rgba(243,239,228,.14);
  --stage:#c9b99a; --stage-bg:rgba(223,255,0,.07); --sand:#262633; --shadow:0 6px 18px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 var(--fs)/1.7 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:680px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--rule)}
.top{display:flex;align-items:center;gap:10px}
.top h1{flex:1;margin:0;font:700 17px/1.3 var(--serif)}
.top h1 small{display:block;font:500 12px var(--font);color:var(--text-2)}
.icon-btn{border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:6px 10px;font-size:15px}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 0;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--neon);border-color:var(--ink)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--neon);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--neon);color:var(--ink)}}
main{flex:1;padding-top:12px}
.view[hidden]{display:none}
.slide{position:relative;aspect-ratio:16/9;width:100%;border-radius:10px;overflow:hidden;background:var(--sand);box-shadow:var(--shadow)}
.slide img{display:block;width:100%;height:100%;object-fit:cover}
.meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:12px 0 4px}
.meta .no{font:700 14px var(--mono);color:var(--rust)}
.meta h2{flex:1 1 100%;margin:0;font:700 calc(var(--fs) + 3px)/1.35 var(--serif)}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--sand);font-size:13px;color:var(--text-2)}
.chip.ciping{background:rgba(193,68,14,.14);color:var(--rust)}
.chip.yiyun{background:rgba(93,138,93,.18);color:var(--sage)}
.script p{margin:0 0 .8em}
.stage{display:inline;padding:1px 4px;border-radius:4px;background:var(--stage-bg);color:var(--stage);font-size:.86em}
.marker{font-weight:700;color:var(--rust)}
.pager{display:flex;align-items:center;gap:10px;margin:12px 0}
.pager button{flex:1;border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:10px 0}
.pager .count{flex:none;font:600 14px var(--mono);color:var(--text-2)}
.cover{display:flex;flex-direction:column;align-items:center;gap:10px;margin:14px 0;padding:26px 16px;border:2px dashed var(--rule);border-radius:12px;text-align:center;color:var(--text-2)}
.primary{border:0;border-radius:12px;padding:12px 18px;background:var(--rust);color:#fff;font-weight:700}
.ghost{border:1px solid var(--rule);border-radius:12px;padding:10px 16px;background:var(--card)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.ok{background:var(--sage)!important;color:#fff!important}
.bad{background:var(--amber)!important;color:#fff!important}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.dots button{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:var(--card);font:600 13px var(--mono)}
.dots button.ok,.dots button.bad{border-color:transparent}
.dots button[aria-current="true"]{outline:3px solid var(--rust);outline-offset:1px}
.rec{display:flex;align-items:center;gap:8px;margin:10px 0;padding:8px 10px;border:1px solid var(--rule);border-radius:12px;background:var(--card);font-size:14px}
.rec .state{flex:1;color:var(--text-2)}
.rec button{border:1px solid var(--rule);background:var(--bg);border-radius:10px;padding:6px 10px;font-size:14px}
.rec button.live{background:#c62828;color:#fff;border-color:#c62828}
.clock{margin:8px 0 2px;font:700 54px/1 var(--mono);font-variant-numeric:tabular-nums}
.clock.near{color:var(--amber)}
.clock.over{color:#c62828}
.bar{height:8px;border-radius:999px;background:var(--sand);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sage);transition:width .3s linear}
.bar i.near{background:var(--amber)}
.bar i.over{background:#c62828}
.total{display:flex;justify-content:space-between;margin:12px 0;font:600 15px var(--mono);color:var(--text-2)}
.big-next{width:100%;margin:12px 0;padding:22px 0;border:0;border-radius:16px;background:var(--ink);color:var(--neon);font:700 22px var(--font)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--mono);white-space:nowrap}
td.over{color:#c62828;font-weight:700}
td.under{color:var(--sage)}
.card{margin:12px 0;padding:18px;border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.card .q{margin:0 0 6px;font:700 calc(var(--fs) + 2px)/1.45 var(--serif)}
.card .qid{font:700 13px var(--mono);color:var(--rust)}
.note{font-size:13px;color:var(--text-2)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{display:flex;width:100%;max-width:680px}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:13px;color:var(--text-2)}
nav.tabs button b{display:block;font-size:20px;line-height:1.2}
nav.tabs button[aria-current="page"]{color:var(--rust);font-weight:700}
dialog{border:0;border-radius:16px;padding:18px;max-width:min(420px,92vw);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;margin:12px 0 4px;font-weight:700}
input[type=range]{width:100%}
.seg.version button{font-size:13px;padding:4px 0}
.seg.version button[aria-pressed="true"]{background:var(--rust);border-color:var(--rust);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.chip.edited{background:rgba(212,138,6,.18);color:var(--amber)}
#read-edit{margin-top:4px}
dialog.editor{width:min(640px,94vw);max-width:none}
dialog textarea{width:100%;margin:10px 0;padding:10px;border:1px solid var(--rule);border-radius:10px;background:var(--bg);color:var(--text);font:400 16px/1.7 var(--font);resize:vertical}
.memo-head{display:flex;gap:12px;align-items:flex-start}
.memo-head .slide{flex:none;width:44%}
.memo-meta{margin:0;flex:1}
.memo-meta h2{font-size:calc(var(--fs) + 1px)}
.levels{margin:12px 0 2px}
.levels button{font-size:13px;padding:6px 0;line-height:1.25}
.levels button small{display:block;font:600 11px var(--mono);opacity:.75}
.tools{align-items:center;margin:8px 0}
.tools select{flex:none;width:auto;border:1px solid var(--rule);border-radius:12px;padding:10px 8px;background:var(--card);color:var(--text);font:inherit;font-size:15px}
.memo .sent{border-radius:4px;transition:background .2s}
.memo .sent.speaking{background:rgba(223,255,0,.45)}
.gap{color:transparent;background:var(--sand);border-radius:3px;cursor:pointer;text-decoration:none}
.gap.peek{color:var(--text-2);background:none;text-decoration:underline dotted}
.miss{color:#c62828;background:rgba(198,40,40,.12);border-radius:3px;text-decoration:underline}
.listen-live{margin:6px 0;padding:10px 12px;border-radius:12px;background:var(--sand);font-size:15px;color:var(--text-2)}
.memo-result .score{font:700 40px/1.1 var(--mono)}
.memo-result .score.pass{color:var(--sage)}
.memo-result .score.fail{color:var(--amber)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <h1>Dateng 簡報練習<small>2026 原住民族教育論壇・11/7</small></h1>
      <button class="icon-btn" id="settings-btn" type="button" aria-label="設定">Aa</button>
    </div>
    <div class="seg" id="speaker" role="group" aria-label="講者">
      <button type="button" data-speaker="all" aria-pressed="true">全部</button>
      <button type="button" data-speaker="ciping" aria-pressed="false">慧麗 1–7</button>
      <button type="button" data-speaker="yiyun" aria-pressed="false">奕芸 8–17</button>
    </div>
    <div class="seg version" id="version" role="group" aria-label="講稿版本" hidden>
      <button type="button" data-version="final" aria-pressed="false">定稿</button>
      <button type="button" data-version="standup" aria-pressed="true">脫口秀版（8–17）</button>
    </div>
  </header>

  <main>
    <!-- ① 逐頁讀稿 -->
    <section class="view" id="view-read" aria-label="逐頁讀稿">
      <div class="slide" data-swipe><img id="read-img" alt=""></div>
      <div class="meta"><span class="no" id="read-no"></span><span class="chip" id="read-speaker"></span><span class="chip" id="read-target"></span><span class="chip edited" id="read-edited" hidden>已修稿</span><h2 id="read-title"></h2></div>
      <div class="rec" data-rec="read"></div>
      <div class="script" id="read-script"></div>
      <button class="ghost" type="button" id="read-edit" style="width:100%">✏️ 修稿</button>
      <div class="pager"><button type="button" data-step="-1">‹ 上一頁</button><span class="count" id="read-count"></span><button type="button" data-step="1">下一頁 ›</button></div>
    </section>

    <!-- 🧠 背稿 -->
    <section class="view" id="view-memo" aria-label="背稿" hidden>
      <div class="memo-head">
        <div class="slide" data-swipe><img id="memo-img" alt=""></div>
        <div class="meta memo-meta"><span class="no" id="memo-no"></span><span class="chip" id="memo-best"></span><span class="chip edited" id="memo-edited" hidden>已修稿</span><h2 id="memo-title"></h2></div>
      </div>
      <div class="seg levels" id="memo-levels" role="group" aria-label="挖空程度"></div>
      <p class="note" id="memo-level-note"></p>
      <div class="row tools">
        <button class="ghost" type="button" id="memo-tts">🔊 朗讀</button>
        <select id="memo-rate" aria-label="朗讀速度"><option value="0.8">慢</option><option value="1">正常</option><option value="1.2">快</option></select>
        <button class="ghost" type="button" id="memo-listen">🎙 說說看・對稿</button>
      </div>
      <div class="listen-live" id="memo-live" hidden></div>
      <div class="card memo-result" id="memo-result" hidden></div>
      <div class="script memo" id="memo-script"></div>
      <div class="row"><button class="ghost" type="button" id="memo-pass">✓ 這一級講順了</button><button class="ghost" type="button" id="memo-edit">✏️ 修稿</button></div>
      <p class="note" style="margin-top:14px">每頁背到第幾級（L0–L4），點數字跳頁：</p>
      <div class="dots" id="memo-dots"></div>
      <div class="pager"><button type="button" data-step="-1">‹ 上一頁</button><span class="count" id="memo-count"></span><button type="button" data-step="1">下一頁 ›</button></div>
    </section>

    <!-- ② 提詞回想 -->
    <section class="view" id="view-recall" aria-label="提詞回想" hidden>
      <div class="slide" data-swipe><img id="recall-img" alt=""></div>
      <div class="meta"><span class="no" id="recall-no"></span><span class="chip" id="recall-target"></span><h2 id="recall-title"></h2></div>
      <div class="rec" data-rec="recall"></div>
      <div class="cover" id="recall-cover">
        <span>看著投影片，先自己講一遍。</span>
        <button class="primary" type="button" id="recall-reveal">講完了，看講稿</button>
      </div>
      <div id="recall-answer" hidden>
        <div class="script" id="recall-script"></div>
        <div class="row"><button class="ghost" type="button" data-mark="ok">✓ 講順了</button><button class="ghost" type="button" data-mark="bad">✗ 卡住了</button></div>
      </div>
      <p class="note" style="margin-top:14px">每頁狀態（綠＝順、橘＝卡住），點數字跳頁：</p>
      <div class="dots" id="recall-dots"></div>
      <div class="row"><button class="ghost" type="button" id="recall-only-bad">只練卡住的頁</button><button class="ghost" type="button" id="recall-reset">清除標記</button></div>
    </section>

    <!-- ③ 整場計時 -->
    <section class="view" id="view-timer" aria-label="整場計時" hidden>
      <div id="timer-idle">
        <div class="card">
          <p class="q">整場計時</p>
          <p class="note" id="timer-plan"></p>
          <p class="note">按「開始」後照平常一樣講，每講完一頁就按大按鈕換下一頁。每頁的目標時間來自逐字稿的時間區間。</p>
          <button class="primary" type="button" id="timer-start" style="width:100%">開始</button>
        </div>
        <div id="timer-last"></div>
      </div>
      <div id="timer-run" hidden>
        <div class="slide"><img id="timer-img" alt=""></div>
        <div class="meta"><span class="no" id="timer-no"></span><h2 id="timer-title"></h2></div>
        <div class="clock" id="timer-clock" aria-live="off">0:00</div>
        <div class="note" id="timer-target"></div>
        <div class="bar"><i id="timer-bar"></i></div>
        <button class="big-next" type="button" id="timer-next">下一頁 ›</button>
        <div class="total"><span id="timer-total">總計 0:00</span><span id="timer-total-target"></span></div>
        <div class="row"><button class="ghost" type="button" id="timer-pause">暫停</button><button class="ghost" type="button" id="timer-stop">結束</button></div>
      </div>
      <div id="timer-result" hidden></div>
    </section>

    <!-- ④ 座談抽考 -->
    <section class="view" id="view-quiz" aria-label="座談抽考" hidden>
      <div class="card">
        <span class="qid" id="quiz-id"></span>
        <p class="q" id="quiz-q"></p>
        <div class="rec" data-rec="quiz"></div>
        <div class="cover" id="quiz-cover"><span>先自己回答，講完再翻卡。</span><button class="primary" type="button" id="quiz-reveal">翻卡看備答</button></div>
        <div id="quiz-answer" hidden><div class="script" id="quiz-a"></div><div class="row"><button class="ghost" type="button" data-qmark="ok">✓ 答得出來</button><button class="ghost" type="button" data-qmark="bad">✗ 再練</button></div></div>
      </div>
      <div class="row"><button class="ghost" type="button" id="quiz-next">下一題 ›</button><button class="ghost" type="button" id="quiz-shuffle">重新洗牌</button></div>
      <div class="dots" id="quiz-dots"></div>
    </section>
  </main>
</div>

<nav class="tabs" aria-label="模式"><div>
  <button type="button" data-view="read" aria-current="page"><b>📖</b>讀稿</button>
  <button type="button" data-view="memo"><b>🧠</b>背稿</button>
  <button type="button" data-view="recall"><b>🙈</b>回想</button>
  <button type="button" data-view="timer"><b>⏱</b>計時</button>
  <button type="button" data-view="quiz"><b>❓</b>抽考</button>
</div></nav>

<dialog id="settings">
  <form method="dialog">
    <strong>顯示設定</strong>
    <label for="fs">講稿字級 <span id="fs-val"></span></label>
    <input type="range" id="fs" min="15" max="26" step="1">
    <label>外觀</label>
    <div class="seg" id="theme" role="group" aria-label="外觀">
      <button type="button" data-theme="auto">跟隨系統</button><button type="button" data-theme="light">淺色</button><button type="button" data-theme="dark">深色</button>
    </div>
    <label>修稿</label>
    <button class="ghost" type="button" id="export-btn" style="width:100%">匯出修稿</button>
    <p class="note">修過的稿只存在這支手機。匯出後貼回 Google 文件，就會變成正式版本。</p>
    <label>錄音</label>
    <button class="ghost" type="button" id="rec-clear" style="width:100%">刪除所有錄音</button>
    <p class="note" id="data-note"></p>
    <button class="primary" value="close" style="width:100%;margin-top:10px">完成</button>
  </form>
</dialog>

<dialog id="editor" class="editor">
  <strong id="edit-title"></strong>
  <p class="note">空一行＝分段。〔〕裡的字是舞台提示，不會被朗讀或對稿。</p>
  <textarea id="edit-text" rows="14" aria-label="講稿內容"></textarea>
  <div class="row"><button class="primary" type="button" id="edit-save">儲存</button><button class="ghost" type="button" id="edit-cancel">取消</button></div>
  <button class="ghost" type="button" id="edit-restore" style="width:100%;margin-top:8px">放棄修改，回到定稿</button>
</dialog>

<dialog id="export">
  <strong>匯出修稿</strong>
  <p class="note">全選複製，再貼到 Google 文件對應的頁面。</p>
  <textarea id="export-text" rows="14" readonly aria-label="修稿內容"></textarea>
  <form method="dialog" class="row"><button class="ghost" type="button" id="export-copy">全選複製</button><button class="primary">關閉</button></form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
